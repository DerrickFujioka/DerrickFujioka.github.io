<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Lemonade</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fef8e7;
            height: 100vh;
            margin: 0;
        }
    </style>
</head>

<body>
    <div id="buy-container">
        <h1>Complete Your Order</h1>
        <form id="buy-form" onsubmit="handlePurchase(event)">
            <input type="text" id="name" name="name" placeholder="Your Name" required>
            <input type="email" id="email" name="email" placeholder="Your Email" required>
            <input type="password" id="credit-card" name="credit-card" placeholder="Credit Card Number" required>
            <input type="password" id="pin" name="pin" placeholder="PIN" required>
            <button id="confirm_purchase" onclick="location.href='Thank_you.html'">Confirm Purchase</button>
        </form>
        <div id="confirmation">Thank you for your purchase! Your order has been processed for free.</div>
        <a id="back-home" href="index.html" style="display: none;">Back to Homepage</a>
    </div>
</body>

</html>
