<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buy Lemonade</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Roboto", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #fef8e7;
        height: 100vh;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="buy-container">
      <h1>Complete Your Order</h1>
      <form id="buy-form" onsubmit="handlePurchase(event)">
        <input type="text" id="name" name="name" placeholder="Your Name" required />
        <input type="email" id="email" name="email" placeholder="Your Email" required />
        <select id="lemonade-choice" name="lemonade-choice" required onchange="updatePrice()">
          <option value="Classic Lemonade">Classic Lemonade - $4.99</option>
          <option value="Pink Lemonade">Pink Lemonade - $5.99</option>
          <option value="Cucumber Lemonade">Cucumber Lemonade - $3.99</option>
          <option value="Peach Lemonade">Peach Lemonade - $5.99</option>
          <option value="Blueberry Lemonade">Blueberry Lemonade - $6.99</option>
          <option value="Watermelon Lemonade">Watermelon Lemonade - $5.99</option>
        </select>
        <input type="number" id="quantity" name="quantity" placeholder="0" min="1" required oninput="updatePrice()" />
        <p id="total-price">Total Price: $0.00</p>
        <input type="password" id="credit-card" name="credit-card" placeholder="Credit Card Number" required />
        <input type="password" id="pin" name="pin" placeholder="PIN" required />
        <button id="confirm_purchase" type="submit">Confirm Purchase</button>
      </form>
      <div id="confirmation" style="display: none;">
        Thank you for your purchase! Your order has been processed for free.
      </div>
      <a id="back-home" href="index.html" style="display: none;">Back to Homepage</a>
    </div>
    <script>
      const prices = {
        "Classic Lemonade": 4.99,
        "Pink Lemonade": 5.99,
        "Cucumber Lemonade": 3.99,
        "Peach Lemonade": 5.99,
        "Blueberry Lemonade": 6.99,
        "Watermelon Lemonade": 5.99,
      };
      
      function updatePrice() {
        // Get the selected lemonade type from the dropdown
        const lemonadeChoice = document.getElementById("lemonade-choice").value;

        // Get the quantity entered by the user and convert it to a number
        const quantity = (document.getElementById("quantity").value);

        // Calculate the total price based on the selected lemonade's price and quantity
        const pricePerLemonade = prices[lemonadeChoice]; // Get the price from the prices object
        const totalPrice = (pricePerLemonade * quantity * 1.04712).toFixed(2); // Multiply and format to 2 decimal places

        // Display the total price on the webpage
        document.getElementById("total-price").innerText = "Total Price: $" +totalPrice ;
      }
      
      function handlePurchase(event) {
        document.getElementById("buy-form").style.display = "none";
        document.getElementById("confirmation").style.display = "block";
        document.getElementById("back-home").style.display = "block";
      }
    </script>
  </body>
</html>
